    <style>
      :root {
        --bg-canvas: #0B0F17;
        --cyan: #38BDF8;
        --emerald: #34D399;
        --text-white: #FFFFFF;
        --text-slate: #E2E8F0;
        --text-muted: #94A3B8;
      }
      body, html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg-canvas);
        color: var(--text-slate);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
                    radial-gradient(circle at 80% 80%, rgba(167, 139, 250, 0.08) 0%, transparent 50%),
                    #0B0F17;
        z-index: 999999;
        transition: opacity 0.5s ease-out;
        padding: 24px;
        box-sizing: border-box;
      }
      .loader-ring {
        display: inline-block;
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }
      .loader-ring div {
        box-sizing: border-box;
        display: block;
        position: absolute;
        width: 58px;
        height: 58px;
        margin: 7px;
        border: 4px solid var(--cyan);
        border-radius: 50%;
        animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        border-color: var(--cyan) transparent transparent transparent;
      }
      .loader-ring div:nth-child(1) { animation-delay: -0.45s; }
      .loader-ring div:nth-child(2) { animation-delay: -0.3s; }
      .loader-ring div:nth-child(3) { animation-delay: -0.15s; }
      @keyframes loader-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loader-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-white);
        letter-spacing: -0.015em;
        margin-bottom: 8px;
        text-align: center;
      }
      .loader-desc {
        font-size: 0.92rem;
        color: var(--text-muted);
        text-align: center;
        max-width: 500px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .loader-pills {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: var(--cyan);
      }
      .pill.live {
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.35);
        color: var(--emerald);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--emerald);
        box-shadow: 0 0 8px var(--emerald);
      }
    </style>
  </head>
